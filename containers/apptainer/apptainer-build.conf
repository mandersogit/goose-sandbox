# sandboxed-goose trusted Apptainer image-build policy
#
# This configuration is used only while building the project-owned definition
# file. It is deliberately separate from apptainer-hostile.conf, which governs
# execution of untrusted model commands.
#
# In particular, do not inherit the system configuration's bind paths for
# /etc/hosts and /etc/localtime. A bind-mounted /etc/localtime prevents tzdata
# from configuring the image, and neither host file belongs in a reproducible
# image. Slice directives such as "bind path" remain empty when omitted from a
# custom configuration.

allow setuid = no
allow ipc ns = yes
allow pid ns = yes
allow user ns = yes
allow uts ns = yes

# Keep the base image's identity files. A temporary generated resolver is
# required only so the trusted build can download signed package metadata.
config passwd = no
config group = no
config resolv_conf = yes

mount proc = yes
mount sys = yes
mount dev = yes
mount devpts = yes
mount home = no
# During a build, "mount tmp = yes" exposes the host's /tmp and /var/tmp.
# Use the root filesystem's own temporary directories instead.
mount tmp = no
mount hostfs = no
mount slave = yes

# The trusted build helper uses this only to replace /tmp and /var/tmp with
# freshly created private directories. The hostile runtime has its own config.
user bind control = yes
enable fusemount = yes
enable overlay = yes
enable underlay = yes

allow container sif = yes
allow container encrypted = no
allow container squashfs = yes
allow container extfs = no
allow container dir = yes
allow setuid-mount encrypted = no
allow setuid-mount squashfs = no
allow setuid-mount extfs = no

# Full capabilities are namespaced fake-root capabilities during this
# explicitly --userns build; they do not grant host-root authority.
root default capabilities = full

always use nv = no
use nvidia-container-cli = no
always use rocm = no
allow monitoring = no

binary path = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
systemd cgroups = yes
