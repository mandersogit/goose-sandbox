# sandboxed-goose context-enabled Apptainer runtime policy
#
# This profile is the explicitly selected exception to apptainer-hostile.conf.
# The trusted launcher supplies the immutable ContextFS executable, its fixed
# arguments, and the /context destination. The model must never select this
# configuration or construct --fusemount arguments.

allow setuid = no
allow ipc ns = yes
allow pid ns = yes
allow user ns = yes
allow uts ns = yes

config passwd = no
config group = no
config resolv_conf = no

mount proc = yes
mount sys = no
mount dev = minimal
mount devpts = yes
mount home = no
mount tmp = yes
mount hostfs = no
mount slave = no

user bind control = yes
enable fusemount = yes
enable overlay = no
enable underlay = no

allow container sif = yes
allow container encrypted = no
allow container squashfs = yes
allow container extfs = no
allow container dir = no
allow setuid-mount encrypted = no
allow setuid-mount squashfs = no
allow setuid-mount extfs = no

always use nv = no
use nvidia-container-cli = no
always use rocm = no
root default capabilities = no
allow monitoring = no

binary path = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
systemd cgroups = yes
