# sandboxed-goose Apptainer runtime policy
#
# This file is intentionally small. Apptainer supplies defaults for scalar
# directives that are not listed. Slice directives, including "bind path",
# remain empty when a custom configuration file is parsed, so do not add any
# implicit host bind paths here.
#
# The trusted launcher must pass this file with:
#
#   apptainer --config /trusted/path/apptainer-hostile.conf exec ...
#
# A custom configuration is accepted for a non-setuid Apptainer installation.
# It must never be selected or modified by the model.

allow setuid = no
allow ipc ns = yes
allow pid ns = yes
allow user ns = yes
allow uts ns = yes

# Keep the image's sanitized identity and resolver files. Do not synthesize
# them from host account or resolver data.
config passwd = no
config group = no
config resolv_conf = no

# /proc is mounted in the new PID namespace. /sys and host filesystems are not
# exposed. --containall supplies a minimal /dev and private temporary storage.
mount proc = yes
mount sys = no
mount dev = minimal
mount devpts = yes
mount home = no
mount tmp = yes
mount hostfs = no
mount slave = no

# Trusted, explicit workspace/home/cache/command-file binds are required.
# Arbitrary --fusemount requests and writable image layers are not.
user bind control = yes
enable fusemount = no
enable overlay = no
enable underlay = no

# Runtime accepts only the immutable SIF/SquashFS image format used by this
# project. Building the image uses the system build configuration, not this
# runtime configuration.
allow container sif = yes
allow container encrypted = no
allow container squashfs = yes
allow container extfs = no
allow container dir = no
allow setuid-mount encrypted = no
allow setuid-mount squashfs = no
allow setuid-mount extfs = no

always use nv = no
use nvidia-container-cli = no
always use rocm = no
root default capabilities = no
allow monitoring = no

# Do not search a caller-controlled PATH for Apptainer helper programs.
binary path = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# Required for rootless cgroup v2 resource controls.
systemd cgroups = yes
