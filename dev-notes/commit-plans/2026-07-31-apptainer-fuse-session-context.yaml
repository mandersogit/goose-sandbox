commits:
  - message: |
      feat: read Goose session context through Apptainer FUSE

      Add an opt-in apptainer-fuse transport that exports a fresh,
      exact-session bundle for every session_context read, mounts it through
      a fixed offline Apptainer invocation, and returns data from a constrained
      in-image filesystem reader. Add bounded path and output validation,
      deterministic real-Goose fixture generation, both-adapter integration
      coverage, and an interactive inspection shell with reliable cleanup.
