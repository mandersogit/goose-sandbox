commits:
  - message: |
      feat: project Goose session history into the sandbox

      Add a bounded, immutable ContextFS frontend that exposes exact-session
      transcripts, messages, and content events through both MCP adapters and
      a read-only Apptainer mount. Preserve safe pre-compaction disclosure
      provenance through a standalone Goose patch, exclude private and
      unrelated content, and cover the complete path with contract, Goose,
      bundle, FUSE, and Apptainer integration tests.
